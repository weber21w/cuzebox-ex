  - Shortcuts: shortcuts.md
  - Input Capture and Playback: input-files.md
  - Input Capture Binary Format: input-movie-format.md
  - Compact / Full Debug Proposal: input-capture-modes.md
  - Video Filters: video-filters.md
  - Sound Options: sound.md
  - Messages and Debugging Output: logging.md
  - Preference Persistence: preference-persistence.md
  - Cheats: cheats.md
  - Serial and Endpoints: serial.md
  - ESP8266 Emulation: esp8266-emulation.md
  - Netplay: netplay.md
  - Debugger: debugger.md
  - API Profiler: api-profiler.md
  - API Disassembly and Run Control: api-run-control.md
  - API Stack Inspection: api-stack.md
  - API Memory Snapshots: api-memory-snapshots.md
  - API Memory Scans: api-memory-scans.md
