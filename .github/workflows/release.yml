name: Native download packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (letters, digits, dots and hyphens)
        required: true
        default: preview
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsdl2-dev libasound2-dev libcurl4-openssl-dev libx264-dev nasm pkg-config patchelf
      - name: Build recording helper
        run: bash packaging/release/build-ffmpeg.sh _obj_/ffmpeg
      - name: Build and check CUEX
        run: |
          export PATH="$PWD/_obj_/ffmpeg/prefix/bin:$PATH"
          DATE="0x$(git show -s --format=%cd --date=format:%Y%m%d HEAD)"
          make -j2 TSYS=linux OBD=_obj_/release OUT=_obj_/release/cuzebox EXTRA_CFLAGS=-DCUEX_DISTRIBUTION=1 VER_DATE="$DATE"
          python3 tools/test_runtime_paths.py _obj_/release/cuzebox
          python3 tools/test_headless_api.py _obj_/release/cuzebox
          python3 tools/test_release_tools.py
          make -j2 -f tests/preferences/Makefile TSYS=linux OBD=_obj_/release OUT=_obj_/release/cuzebox EXTRA_CFLAGS=-DCUEX_DISTRIBUTION=1 VER_DATE="$DATE" interrupt-test storage-test video-messages-test
          python3 tools/test_video_messages.py _obj_/release
      - name: Package
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          python3 tools/release_package.py build --platform linux --version "$VERSION" --binary _obj_/release/cuzebox --ffmpeg _obj_/ffmpeg/prefix/bin/ffmpeg --ffprobe _obj_/ffmpeg/prefix/bin/ffprobe
          python3 tools/test_release_package.py --linux dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: cuex-linux-x86_64
          path: dist/
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils tar nasm
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-x264 mingw-w64-x86_64-python
      - name: Build recording helper
        run: |
          set -euo pipefail
          mkdir -p _obj_/ci-logs
          bash packaging/release/build-ffmpeg.sh _obj_/ffmpeg 2>&1 | tee _obj_/ci-logs/windows-ffmpeg.log
      - name: Build and check CUEX
        run: |
          set -euo pipefail
          export PATH="$PWD/_obj_/ffmpeg/prefix/bin:$PATH"
          export DATE="0x$(git show -s --format=%cd --date=format:%Y%m%d HEAD)"
          bash -euo pipefail <<'CUEX_SCRIPT' 2>&1 | tee _obj_/ci-logs/windows-native.log
            command -v make gcc python3 ffmpeg ffprobe
            make -j2 TSYS=windows_mingw OBD=_obj_/release OUT=_obj_/release/cuzebox.exe FLAG_REMOTE_ROMS_LIBCURL=0 EXTRA_CFLAGS=-DCUEX_DISTRIBUTION=1 VER_DATE="$DATE"
            python3 tools/test_runtime_paths.py _obj_/release/cuzebox.exe
            python3 tools/test_headless_api.py _obj_/release/cuzebox.exe
            make -j2 -f tests/preferences/Makefile TSYS=windows_mingw OBD=_obj_/release OUT=_obj_/release/cuzebox.exe FLAG_REMOTE_ROMS_LIBCURL=0 EXTRA_CFLAGS=-DCUEX_DISTRIBUTION=1 VER_DATE="$DATE" interrupt-test storage-test video-messages-test
            python3 tools/test_video_messages.py _obj_/release
          CUEX_SCRIPT
      - name: Package
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          bash -euo pipefail <<'CUEX_SCRIPT' 2>&1 | tee _obj_/ci-logs/windows-package.log
            python3 tools/release_package.py build --platform windows --version "$VERSION" --binary _obj_/release/cuzebox.exe --ffmpeg _obj_/ffmpeg/prefix/bin/ffmpeg.exe --ffprobe _obj_/ffmpeg/prefix/bin/ffprobe.exe --dependency-dir "$(cygpath -m "$MINGW_PREFIX/bin")"
            python3 tools/test_release_package.py --windows dist/*windows*.zip
          CUEX_SCRIPT
      - uses: actions/upload-artifact@v4
        with:
          name: cuex-windows-x86_64
          path: dist/
          if-no-files-found: error
      - name: Report Windows build failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('_obj_/ci-logs').glob('windows-*.log'):
              message=p.read_text(errors='replace')[-3500:]
              message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title='+p.name+'::'+message)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-windows
          path: |
            _obj_/ci-logs/
            _obj_/ffmpeg/build/ffbuild/config.log
          if-no-files-found: ignore
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: cuex-*
      - name: Create draft release with checked packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/collect_release_artifacts.py downloads release-assets
          gh release create "$TAG" release-assets/* --verify-tag --draft --title "CUEX $TAG" --notes-file packaging/release/RELEASE-NOTES.md
