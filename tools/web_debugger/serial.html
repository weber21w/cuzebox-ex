<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUzeBox Serial Debugger</title><link rel="stylesheet" href="/static/common.css"></head><body>
<header><strong>CUzeBox Serial Debugger</strong><nav><a href="/controls">Controls</a><a href="/debugger">Debugger</a><a href="/sd">SD Card</a><a href="/audio">Audio</a><a href="/serial">Serial</a><a href="/network">Network</a></nav><div class="spacer"></div><div class="status"><span id="dot" class="dot"></span><span id="connection">Connecting…</span></div></header>
<div class="grid equal"><div class="stack">
<section class="panel"><h2>Serial Routing</h2><div class="body"><div class="row"><label>Route <select id="route"><option value="0">Disconnected</option><option value="1">ESP Module</option><option value="2">Host Serial</option><option value="3">Host MIDI</option><option value="4">Virtual MIDI</option><option value="5">TCP Serial</option><option value="6">Loopback</option></select></label><button onclick="apply('ROUTE','route')">Apply</button></div><div class="row"><label>UART <select id="uart"><option value="0">Hardware/default</option><option value="1">Fast</option><option value="2">Debug</option></select></label><button onclick="apply('UART_PROFILE','uart')">Apply</button></div><div class="row"><label>ESP model <select id="espModel"><option value="1">ESP8266</option><option value="2">ESP8285</option><option value="3">ESP32-like</option></select></label><button onclick="apply('ESP_MODEL','espModel')">Apply</button><label>AT firmware <select id="atFw"><option value="0">Legacy</option><option value="1">Modern</option></select></label><button onclick="apply('AT_FIRMWARE','atFw')">Apply</button></div><div class="row"><label>SoftAP <select id="softap"><option value="0">Hint/default</option><option value="1">Disable</option><option value="2">Enable</option></select></label><button onclick="apply('SOFTAP_MODE','softap')">Apply</button></div></div></section>
<section class="panel"><h2>Host / MIDI Backends</h2><div class="body"><div class="row"><label>Host serial <input id="hostSerial" class="wide"></label><button onclick="applyText('HOST_SERIAL','hostSerial')">Apply</button></div><div class="row"><label>Host MIDI <input id="hostMidi" class="wide"></label><button onclick="applyText('HOST_MIDI','hostMidi')">Apply</button></div><div class="row"><label>Virtual MIDI mode <select id="vmMode"><option value="1">Instrument</option><option value="2">Port</option><option value="3">Bidirectional</option></select></label><button onclick="apply('VIRTUAL_MIDI_MODE','vmMode')">Apply</button></div><div class="row"><label>Virtual MIDI port <input id="vmPort" class="wide"></label><button onclick="applyText('VIRTUAL_MIDI_PORT','vmPort')">Apply</button></div></div></section>
<section class="panel"><h2>TCP Serial</h2><div class="body"><div class="row"><label>Host <input id="tcpHost" class="wide"></label><button onclick="applyText('TCP_HOST','tcpHost')">Apply</button></div><div class="row"><label>Port <input id="tcpPort" class="small"></label><button onclick="apply('TCP_PORT','tcpPort')">Apply</button><label>Mode <select id="tcpMode"><option value="0">Client</option><option value="1">Server</option><option value="2">Auto</option><option value="3">Internet (relay room)</option><option value="4">LAN (auto-find)</option></select></label><button onclick="apply('TCP_MODE','tcpMode')">Apply</button></div><div class="row"><label><input id="tcpReconnect" type="checkbox"> Auto reconnect</label><button onclick="applyBool('TCP_AUTORECONNECT','tcpReconnect')">Apply</button><button onclick="command('TCP_DIAG RESET',false)">Reset diagnostics</button><button onclick="command('TCP_DIAG FLUSH',false)">Flush log</button></div><div id="tcpDiag" class="mono"></div></div></section>
<section class="panel"><h2>Link: Internet / LAN</h2><div class="body"><div class="row"><label>Room code <input id="linkRoom" class="small" maxlength="8"></label><button onclick="newRoom()">New code</button><button onclick="applyText('LINK_ROOM','linkRoom')">Apply</button></div><div class="row"><label>Relay <input id="relayHost"></label><label>Port <input id="relayPort" class="small"></label><button onclick="applyText('RELAY_HOST','relayHost').then(()=>apply('RELAY_PORT','relayPort'))">Apply</button></div><div class="row"><button onclick="linkStart(3)">Join internet room</button><button onclick="linkStart(4)">Search LAN</button><button onclick="command('SERIAL_SET TCP_RESTART 1',false)">Restart link</button></div><div id="linkInfo" class="kvgrid"></div><div id="lanPeers"></div></div></section>
<section class="panel"><h2>Bad Connection Simulator</h2><div class="body"><div class="muted">Applied to bytes this instance receives; order is always preserved.</div><div class="row"><label>Latency ms <input id="impLat" class="small"></label><label>Jitter ms <input id="impJit" class="small"></label></div><div class="row"><label>Stall every ms <input id="impSE" class="small"></label><label>Stall length ms <input id="impSL" class="small"></label></div><div class="row"><label>Noise ppm <input id="impNoise" class="small"></label><label>Drop ppm <input id="impDrop" class="small"></label></div><div class="row"><label><input id="impOn" type="checkbox"> Enabled</label><button onclick="applyImpair()">Apply</button></div><div id="impInfo" class="mono"></div></div></section>
</div><div class="stack">
<section class="panel"><h2>Live UART / Backend Status</h2><div class="body"><div id="statusGrid" class="kvgrid"></div><pre id="uartStatus" class="mono"></pre></div></section>
<section class="panel"><h2>Serial Trace</h2><div class="body"><div class="row"><button onclick="command('SERIAL_TRACE ON',false)">On</button><button onclick="command('SERIAL_TRACE OFF',false)">Off</button><button onclick="command('SERIAL_TRACE CLEAR',false)">Clear</button><button onclick="command('SERIAL_TRACE EXPORT COOKED',false)">Export cooked</button><button onclick="command('SERIAL_TRACE EXPORT RAW',false)">Export raw</button><label><input id="autoScroll" type="checkbox" checked> Auto-scroll</label></div><div id="traceInfo" class="muted"></div><div id="trace" class="trace mono"></div></div></section>
</div></div><script src="/static/common.js"></script><script>
let first=true,busy=false;const kv=(k,v)=>`<div class="kv"><b>${esc(k)}</b><br><span>${esc(v)}</span></div>`;
async function apply(k,id){await command(`SERIAL_SET ${k} ${$(id).value}`,false);await refresh()}async function applyText(k,id){const v=$(id).value.trim();await command(`SERIAL_SET ${k}${v?' '+v:''}`,false);await refresh()}async function applyBool(k,id){await command(`SERIAL_SET ${k} ${$(id).checked?1:0}`,false);await refresh()}
function setOnce(r){if(!first)return;first=false;$('route').value=r.route;$('uart').value=r.uart_profile;$('espModel').value=r.esp_model;$('atFw').value=r.at_firmware;$('softap').value=r.esp_softap_mode;$('hostSerial').value=r.host_serial||'';$('hostMidi').value=r.host_midi||'';$('vmMode').value=r.virtual_midi_mode;$('vmPort').value=r.virtual_midi_port||'';$('tcpHost').value=r.tcp_host||'';$('tcpPort').value=r.tcp_port;$('tcpMode').value=r.tcp_mode;$('tcpReconnect').checked=!!r.tcp_auto_reconnect}
let firstLink=true;
function newRoom(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<6;i++)c+=a[Math.floor(Math.random()*a.length)];$('linkRoom').value=c}
async function linkStart(mode){if(mode===3){const v=$('linkRoom').value.trim();if(!v){newRoom()}await command(`SERIAL_SET LINK_ROOM ${$('linkRoom').value.trim()}`,false)}await command(`SERIAL_SET TCP_MODE ${mode}`,false);await command('SERIAL_SET ROUTE 5',false);await command('SERIAL_SET TCP_RESTART 1',false);$('tcpMode').value=mode;await refresh()}
async function applyImpair(){const n=id=>Math.max(0,parseInt($(id).value||'0',10)||0);for(const [k,id] of [['LATENCY_MS','impLat'],['JITTER_MS','impJit'],['STALL_EVERY_MS','impSE'],['STALL_MS','impSL'],['NOISE_PPM','impNoise'],['DROP_PPM','impDrop']])await command(`SERIAL_SET ${k} ${n(id)}`,true);await command(`SERIAL_SET IMPAIR ${$('impOn').checked?1:0}`,false);await refresh()}
const LINK_PHASE=['idle','joining room','creating room','waiting for other player','linked/handshaking','retrying'];
function renderLink(r){const L=r.link;if(!L)return;if(firstLink){firstLink=false;$('linkRoom').value=L.room||'';$('relayHost').value=L.relay_host||'';$('relayPort').value=L.relay_port||'';const I=L.impair||{};$('impLat').value=I.latency_ms;$('impJit').value=I.jitter_ms;$('impSE').value=I.stall_every_ms;$('impSL').value=I.stall_ms;$('impNoise').value=I.noise_ppm;$('impDrop').value=I.drop_ppm;$('impOn').checked=!!I.enabled}
 const N=L.internet||{},A=L.lan||{},I=L.impair||{};
 const parts=[];if(r.tcp_mode===3){parts.push(kv('Internet',N.connected?(N.direct?'linked · direct UDP':'linked · via relay'):(LINK_PHASE[N.phase]||N.phase)),kv('RTT',`${N.srtt_ms} ms (rto ${N.rto_ms})`),kv('Packets tx/rx',`${N.pkts_tx} / ${N.pkts_rx}`),kv('Retransmits',N.retransmits),kv('Unacked',N.unacked),kv('Notice',N.notice||''))}
 if(r.tcp_mode===4){parts.push(kv('LAN',A.linked?'linked':(A.paired?'pairing…':'searching')),kv('Role',A.paired?(A.server?'server':'client'):'-'),kv('Instances seen',A.peers),kv('Beacons rx',A.beacons_rx))}
 $('linkInfo').innerHTML=parts.join('');
 const P=L.lan_peers||[];$('lanPeers').innerHTML=(r.tcp_mode===4&&P.length)?'<table class="mono"><tr><th>Name</th><th>IP</th><th>ROM</th><th>Status</th><th></th></tr>'+P.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.ip)}</td><td>${p.same_rom?'same':'other'}</td><td>${p.searching?'searching':'busy'}${p.wants_us?' · wants you':''}</td><td><button onclick="command('SERIAL_SET LAN_CHOOSE ${p.id}',false)">Pair</button></td></tr>`).join('')+'</table>':'';
 $('impInfo').textContent=`${I.enabled?'ON':'off'} · queued ${I.queued} · corrupted ${I.corrupted} · dropped ${I.dropped} · stalls ${I.stalls}${I.overflow?' · overflow '+I.overflow:''}`}
async function refresh(){if(busy)return;busy=true;try{const r=await command('SERIAL_STATUS');if(!r.ok){$('statusGrid').innerHTML=kv('Unavailable',r.error||'ENABLE_ESP not built');return}setOnce(r);renderLink(r);$('statusGrid').innerHTML=[kv('Route',r.route),kv('UART profile',r.uart_profile),kv('TCP state',r.tcp_state),kv('TCP error',r.tcp_last_error),kv('AVR TX / RX',`${r.avr_tx} / ${r.avr_rx}`),kv('Backend TX / RX',`${r.backend_tx} / ${r.backend_rx}`),kv('Trace events',r.trace_events),kv('Dropped',r.trace_dropped),kv('Trace full',r.trace_full?'yes':'no'),kv('Config events',r.config_events)].join('');$('uartStatus').textContent=r.uart_status||'';const d=r.tcp_diag||{};$('tcpDiag').textContent=`AVR→backend ${d.avr_to_backend||0}  backend→AVR ${d.backend_to_avr||0}\nsocket TX ${d.socket_tx||0}  RX ${d.socket_rx||0}\nTX queue ${d.tx_queue||0} (high ${d.tx_high_water||0})  RX queue ${d.rx_queue||0} (high ${d.rx_high_water||0})\nwould-block TX/RX ${d.send_would_block||0}/${d.recv_would_block||0}  errors ${d.send_errors||0}/${d.recv_errors||0}\nmax service gap ${d.max_service_gap_ms||0} ms  log ${d.log_path||''}`;const t=await command('SERIAL_TRACE READ');if(t.ok){$('traceInfo').textContent=`${t.total} lines · trace ${r.trace_enabled?'ON':'OFF'}`;$('trace').textContent=(t.lines||[]).join('\n');if($('autoScroll').checked)$('trace').scrollTop=$('trace').scrollHeight}}finally{busy=false}}
window.addEventListener('cuzebox-event',e=>{if(['SERIAL'].includes(e.detail.event))refresh();});
(async()=>{await bridgeStatus();await refresh();setInterval(refresh,500)})();
</script></body></html>
