<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUzeBox Network Debugger</title><link rel="stylesheet" href="/static/common.css"></head><body>
<header><strong>CUzeBox Network Debugger</strong><nav><a href="/controls">Controls</a><a href="/debugger">Debugger</a><a href="/sd">SD Card</a><a href="/audio">Audio</a><a href="/serial">Serial</a><a href="/network">Network</a></nav><div class="spacer"></div><div class="status"><span id="dot" class="dot"></span><span id="connection">Connecting…</span></div></header>
<div class="grid equal"><div class="stack"><section class="panel"><h2>ESP Core / Wi-Fi</h2><div class="body"><div id="espCore" class="kvgrid"></div></div></section><section class="panel"><h2>ESP Links</h2><div class="body"><table class="mono"><thead><tr><th>ID</th><th>Open</th><th>State</th><th>Type</th><th>Host</th><th>Port</th><th>Error</th><th>Ready ms</th></tr></thead><tbody id="links"></tbody></table></div></section></div><div class="stack"><section class="panel"><h2>ESP Network State</h2><div class="body"><div id="espNet" class="kvgrid"></div></div></section><section class="panel"><h2>Netplay</h2><div class="body"><div id="netplay" class="kvgrid"></div><pre id="netNotice" class="mono muted"></pre></div></section></div></div>
<script src="/static/common.js"></script><script>
let busy=false;const kv=(k,v)=>`<div class="kv"><b>${esc(k)}</b><br><span>${esc(v)}</span></div>`;
async function refresh(){if(busy)return;busy=true;try{const [e,n]=await Promise.all([command('ESP_STATUS'),command('NETPLAY_STATUS')]);if(e.ok){$('espCore').innerHTML=[kv('State',e.state),kv('Ready',e.ready),kv('Model',e.emulation_model),kv('Baud',e.baud_rate),kv('UART profile',e.uart_profile),kv('UART overrun',e.uart_overrun),kv('RX errors',e.uart_rx_error_flags),kv('Active socket',e.active_socket),kv('Send socket',e.send_socket),kv('CIP mode',e.cip_mode),kv('CIPBUF mode',e.cipbuf_mode)].join('');$('espNet').innerHTML=[kv('Wi-Fi mode',e.wifi_mode),kv('SSID',e.wifi_ssid||''),kv('RSSI',e.wifi_rssi),kv('Channel',e.wifi_channel),kv('Station IP',e.station_ip||''),kv('Gateway',e.station_gateway||''),kv('Netmask',e.station_netmask||''),kv('SoftAP SSID',e.softap_ssid||''),kv('SoftAP IP',e.softap_ip||''),kv('LAN',e.lan_enabled?'enabled':'disabled'),kv('LAN joined',e.lan_joined),kv('DNS pending',e.dns_pending),kv('Ping pending',e.ping_pending),kv('Server',e.server_enabled?`:${e.server_port}`:'off')].join('');$('links').innerHTML='';(e.links||[]).forEach(l=>$('links').insertAdjacentHTML('beforeend',`<tr><td>${l.id}</td><td>${l.open}</td><td>${l.state}</td><td>${l.type}</td><td>${esc(l.host)}</td><td>${l.port}</td><td>${l.error}</td><td>${l.ready_ms}</td></tr>`))}else{$('espCore').innerHTML=kv('ESP diagnostics unavailable',e.error||'ENABLE_ESP not built');$('espNet').innerHTML='';$('links').innerHTML=''}if(n.ok){const r=n.runtime||{};$('netplay').innerHTML=[kv('Enabled',n.enabled),kv('Connected',n.connected),kv('Peer',`${n.peer_host||''}:${n.peer_port||0}`),kv('Interface',n.network_interface||''),kv('Local address',n.local_address||''),kv('Ping',`${n.ping_ms||0} ms`),kv('Smoothed',`${n.ping_smoothed_ms||0} ms`),kv('Jitter',`${n.ping_jitter_ms||0} ms`),kv('Duplicates',n.rx_dup),kv('Out-of-order',n.rx_ooo),kv('Gaps',n.rx_gap),kv('Relay',n.relay_mode),kv('Direct',n.direct_established),kv('Session',n.session_started),kv('Frame',r.frame||0),kv('Rollback',r.rollback_window||0),kv('Input delay',r.input_delay||0),kv('Predicted',r.predicted||0),kv('Stalled',r.stalled||0),kv('Resim',r.resim_applied?`${r.resim_from}..${r.resim_to}`:'no')].join('');$('netNotice').textContent=[n.notice,n.compat_reason].filter(Boolean).join('\n')}else{$('netplay').innerHTML=kv('Netplay diagnostics unavailable',n.error||'ENABLE_NETPLAY not built');$('netNotice').textContent=''}}finally{busy=false}}
window.addEventListener('cuzebox-event',e=>{if(['ESP'].includes(e.detail.event))refresh();});
(async()=>{await bridgeStatus();await refresh();setInterval(refresh,500)})();
</script></body></html>
