# CUzeBox user config
# Missing entries fall back to built-in defaults.
# Booleans accept 0/1, false/true, off/on, or no/yes.

# -----------------------------------------------------------------------------
# Core emulator
# -----------------------------------------------------------------------------
Version=1

# Display
DisplayGameOnly=0
DisplayFullscreen=0
SystemMessages=1
GuiGamepad=1
# GuiGamepadSpeed: host GUI cursor speed percentage
GuiGamepadSpeed=50
GuiPauseWhileOpen=1
GuiVirtualKeyboard=0
FrameRateLimiter=1
FrameMerge=1
# RenderPath: 0=potato, 1=classic1x, 2=classic2x, 3=staged
RenderPath=3

# Input
InputKbUzEm=0
InputPlayer2Alloc=0

# Audio
# AudioOutputRate: 0=44100, 1=48000, 2=96000
# AudioLatency: 0=low, 1=normal, 2=safe
# AudioResampler: 0=hold, 1=linear, 2=cubic
# AudioLowPass: 0=off, 1=light, 2=medium, 3=strong
# AudioLowPassQuality: 0=simple, 1=hq
# AudioMonitorMode: 0=mono, 1=stereo, 2=wide
# AudioReverb: 0=off, 1=light, 2=medium, 3=strong
# AudioMonitorWidth and AudioMasterVolume are percentages.
AudioFreqScale=1
AudioS16=1
AudioOutputRate=1
AudioLatency=1
AudioResampler=1
AudioDcBlock=1
AudioLowPass=1
AudioLowPassQuality=1
AudioMonitorMode=0
AudioMonitorWidth=100
AudioReverb=0
AudioMasterVolume=100

# Mouse / filters
# MouseScale: 0..5
# Filters only apply in RenderPath=3 (staged).
# FilterPreMode: 0=none, 1=composite
# FilterScaleMode: 0=nearest, 1=scale2x, 2=hq2x, 3=xbr2x
# FilterCrtMode: 0=none, 1=scan25, 2=scan37, 3=scan50, 4=grille,
#                5=shadowmask, 6=curvature, 9=grille+scanlines, 10=mask+scanlines,
#                11=bumpmap, 12=lucid, 13=heatwave
MouseEnable=0
MouseScale=0
FilterPreMode=0
FilterScaleMode=0
FilterCrtMode=0
# SpiRamPagesMode: 0=.UZE hint, 1=disable, 2=1 page, 3=2 pages, 4=4 pages, 5=8 pages, 6=16 pages, 7=32 pages, 8=64 pages, 9=128 pages
SpiRamPagesMode=0
# EspSoftApMode: 0=.UZE hint, 1=disable, 2=enable
EspSoftApMode=0
# NetplayRollbackWindow: predicted frames allowed before stall
# NetplayInputDelay: fixed local input delay in frames
NetplayRollbackWindow=12
NetplayInputDelay=1
# NetplayNetworkInterface: blank=auto route, otherwise bind to a specific local IPv4/IPv6 address
NetplayRelayHost=uzenet.us
NetplayNetworkInterface=
NetplayRelayPort=43810
RemoteRomsHost=uzenet.us
VideoDumpFile=video/CAPTURE001.MP4
VideoDumpAutoInc=1
VideoDumpResetFirst=0

# Bootloader / flash persistence
# ResidentBootloader: when enabled, normal ROM loads contain CUzeBox's
# compiled-in Bootloader 5 image and AVR resets enter it through BOOTRST.
# ResidentBootloaderFile is an optional override; if the file is absent, the
# compiled-in image is used. Only its 4 KiB boot section is imported.
ResidentBootloader=0
ResidentBootloaderFile=Bootloader.hex

# GUI appearance
# GUI colors are RGBA bytes.
# Padding, spacing, scrollbar size, thumb size, and title height are compile-time constants.
GuiColorText=255,232,196,255
GuiColorBorder=52,24,0,255
GuiColorWindowBg=86,44,8,255
GuiColorTitleBg=68,28,0,255
GuiColorTitleText=255,244,220,255
GuiColorPanelBg=0,0,0,0
GuiColorButton=132,72,16,255
GuiColorButtonHover=160,96,28,255
GuiColorButtonFocus=188,124,48,255
GuiColorBase=58,32,6,255
GuiColorBaseHover=70,38,10,255
GuiColorBaseFocus=84,46,16,255
GuiColorScrollBase=98,58,18,255
GuiColorScrollThumb=70,38,10,255

# Paths
RomPath=roms
ScreenshotPath=screenshots
SavePath=savestates
ControllerDbPath=

# Recent ROMs
RecentRomFreeze=0
RecentRom0=roms/MusicDemo.uze
RecentRom1=
RecentRom2=
RecentRom3=
RecentRom4=
RecentRom5=
RecentRom6=
RecentRom7=
RecentRom8=
RecentRom9=

# API server
# ApiServer is temporary default-on for development. Change to 0 before release.
ApiServer=0
ApiServerPort=24680

# Cheats
CheatsEnabled=1
CheatsAutoLoadSave=1

